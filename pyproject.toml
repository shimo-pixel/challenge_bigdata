[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "challenge-text2query"
version = "0.1.0"
description = "Reproducible Text2Query pipeline for the supplied challenge"
requires-python = ">=3.10"
dependencies = ["sqlglot>=27,<29", "rarfile>=4.2"]

[project.scripts]
text2query = "text2query.cli:main"

[tool.setuptools.packages.find]
include = ["text2query*"]
